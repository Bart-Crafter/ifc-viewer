<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D model — Crafter Engineering</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="viewer-body">
    <header class="viewer-header">
      <img src="/favicon.png" alt="Crafter Engineering" class="brand-mark" />
      <a href="/" id="back-link" class="back-link">&larr; Project</a>
      <div class="model-meta">
        <span id="model-name">Loading…</span>
        <span id="model-revision"></span>
      </div>
      <div class="viewer-tools">
      <select id="shading-select" class="shading-select hidden" title="Shading style" aria-label="Shading style">
        <option value="shaded">Shaded</option>
        <option value="shadows">Realistic</option>
        <option value="clay">Clay</option>
      </select>
      <button id="section-button" type="button" class="secondary hidden" title="Cut the model with a section box">◧ Section</button>
      <button id="reset-view-button" type="button" class="secondary hidden" title="Return to the full view of the model">⟲ Reset view</button>
      <button id="measure-button" type="button" class="secondary hidden">📏 Ruler</button>
      <button id="clear-measure-button" type="button" class="secondary hidden">Clear</button>
      <button id="help-button" type="button" class="secondary" title="How to use the 3D view" aria-label="Help">?</button>
      <button id="download-button" type="button" class="secondary hidden">⬇ IFC</button>
      </div>
    </header>

    <div id="viewer-container"></div>
    <div id="viewer-status" class="viewer-status"></div>
    <div id="viewer-hint" class="viewer-hint hidden"></div>

    <aside id="property-panel" class="property-panel hidden">
      <button id="close-panel" class="close-btn" type="button">&times;</button>
      <div id="property-content"></div>
    </aside>

    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
